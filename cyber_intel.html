<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberIntel — M&A Intelligence Platform</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Design tokens ─────────────────────────────────── */
:root{
  --bg:       #05070e;
  --bg2:      #090d18;
  --panel:    #0c1120;
  --border:   #16213a;
  --border2:  #1e2e4a;
  --accent:   #00c8f0;
  --blue:     #0057e0;
  --purple:   #6c3fff;
  --green:    #00d97a;
  --red:      #ff3c6e;
  --yellow:   #f5c400;
  --text:     #e4eaf5;
  --text2:    #8494b2;
  --text3:    #3d5070;
  --mono:     'IBM Plex Mono', monospace;
  --sans:     'Inter', sans-serif;
  --display:  'Bebas Neue', cursive;
}

/* ── Reset & base ──────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden;}

/* Subtle grid overlay */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(0,200,240,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,200,240,.025) 1px,transparent 1px);
  background-size:44px 44px;
}

.shell{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 28px 100px;}

/* ── Header ────────────────────────────────────────── */
.site-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 0 18px;
  border-bottom:1px solid var(--border);
  margin-bottom:40px;
}
.logo{display:flex;align-items:center;gap:11px;}
.logo-hex{
  width:34px;height:34px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--blue));
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;font-weight:600;color:#000;
}
.logo-name{font-family:var(--display);font-size:21px;letter-spacing:2px;}
.logo-name em{color:var(--accent);font-style:normal;}
.hdr-right{font-family:var(--mono);font-size:10px;color:var(--text3);text-align:right;line-height:1.8;}
.live-dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--green);animation:blink 2.2s ease-in-out infinite;
  margin-right:5px;vertical-align:middle;
}
@keyframes blink{0%,100%{opacity:1;}55%{opacity:.2;}}

/* ── Input panel ───────────────────────────────────── */
.input-panel{
  background:var(--panel);border:1px solid var(--border2);border-radius:6px;
  padding:28px 30px 24px;margin-bottom:32px;position:relative;overflow:hidden;
}
.input-panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--blue),var(--accent),var(--purple));
}
.panel-title{
  font-family:var(--mono);font-size:10px;letter-spacing:3px;
  color:var(--accent);text-transform:uppercase;margin-bottom:18px;
}

/* API key row */
.key-row{
  display:flex;align-items:center;gap:10px;
  background:rgba(245,196,0,.03);border:1px solid rgba(245,196,0,.2);
  border-radius:4px;padding:10px 14px;margin-bottom:8px;
}
.key-label{font-family:var(--mono);font-size:10px;color:var(--yellow);letter-spacing:2px;white-space:nowrap;}
.key-input{
  flex:1;min-width:0;background:var(--bg);border:1px solid var(--border2);
  border-radius:3px;padding:7px 12px;color:var(--text);
  font-family:var(--mono);font-size:12px;outline:none;transition:border-color .15s;
}
.key-input:focus{border-color:var(--yellow);}
.key-input::placeholder{color:var(--text3);}
.key-hint{font-family:var(--mono);font-size:9px;color:var(--text3);margin-bottom:18px;line-height:1.6;}
.key-hint a{color:var(--accent);text-decoration:none;}
.key-hint a:hover{text-decoration:underline;}

/* Inputs row */
.inputs-row{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end;}
.field{display:flex;flex-direction:column;gap:6px;}
.field-lbl{font-family:var(--mono);font-size:10px;color:var(--text2);letter-spacing:2px;text-transform:uppercase;}
.field-inp{
  background:var(--bg);border:1px solid var(--border2);border-radius:3px;
  padding:11px 14px;color:var(--text);font-family:var(--mono);font-size:13px;
  outline:none;transition:border-color .15s;width:100%;
}
.field-inp:focus{border-color:var(--accent);}
.field-inp::placeholder{color:var(--text3);}

.gen-btn{
  height:44px;padding:0 26px;
  background:linear-gradient(135deg,var(--blue),var(--accent));
  border:none;border-radius:3px;
  color:#000;font-family:var(--mono);font-size:12px;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;
  cursor:pointer;transition:opacity .15s,transform .1s;white-space:nowrap;
  display:flex;align-items:center;gap:7px;
}
.gen-btn:hover:not(:disabled){opacity:.88;transform:translateY(-1px);}
.gen-btn:active:not(:disabled){transform:translateY(0);}
.gen-btn:disabled{opacity:.38;cursor:not-allowed;transform:none;}

/* ── Error banner ──────────────────────────────────── */
.err-banner{
  display:none;align-items:flex-start;gap:10px;
  background:rgba(255,60,110,.06);border:1px solid rgba(255,60,110,.3);
  border-radius:4px;padding:14px 18px;margin-bottom:24px;
}
.err-banner.show{display:flex;}
.err-icon{color:var(--red);font-size:14px;flex-shrink:0;margin-top:1px;}
.err-msg{font-family:var(--mono);font-size:11px;color:var(--red);line-height:1.6;}

/* ── Progress panel ────────────────────────────────── */
.progress-panel{
  display:none;background:var(--panel);border:1px solid var(--border);
  border-radius:6px;padding:26px 30px;margin-bottom:28px;
}
.progress-panel.show{display:block;}
.prog-hdr{display:flex;align-items:center;gap:9px;margin-bottom:18px;}
.prog-title{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;}
.prog-track{background:var(--bg);border-radius:2px;height:3px;overflow:hidden;margin-bottom:14px;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--accent));border-radius:2px;transition:width .5s ease;width:0%;}
.prog-steps{display:flex;flex-direction:column;gap:5px;}
.prog-step{font-family:var(--mono);font-size:11px;color:var(--text3);display:flex;align-items:center;gap:8px;transition:color .25s;}
.prog-step.running{color:var(--accent);}
.prog-step.done{color:var(--green);}
.step-ic{width:13px;flex-shrink:0;font-size:11px;}

/* ── Report container ──────────────────────────────── */
.report-wrap{display:none;}
.report-wrap.show{display:block;}

/* Report header */
.rpt-header{
  display:grid;grid-template-columns:1fr auto;
  align-items:start;gap:20px;
  margin-bottom:28px;padding-bottom:24px;
  border-bottom:1px solid var(--border);
}
.rpt-company{font-family:var(--display);font-size:54px;letter-spacing:3px;line-height:1;color:var(--text);}
.rpt-badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.rbadge{
  font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;
  padding:3px 9px;border-radius:2px;border:1px solid;
}
.rb-blue  {color:var(--accent); border-color:var(--accent); background:rgba(0,200,240,.06);}
.rb-green {color:var(--green);  border-color:var(--green);  background:rgba(0,217,122,.06);}
.rb-purple{color:var(--purple); border-color:var(--purple); background:rgba(108,63,255,.06);}
.rb-yellow{color:var(--yellow); border-color:var(--yellow); background:rgba(245,196,0,.06);}

.rpt-meta{
  background:var(--panel);border:1px solid var(--border);
  border-radius:4px;padding:18px;min-width:190px;text-align:right;
}
.meta-lbl{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;}
.meta-val{font-family:var(--mono);font-size:11px;color:var(--text2);}
.conf-row{margin-top:12px;}
.conf-track{background:var(--bg);border-radius:2px;height:3px;overflow:hidden;margin-top:5px;}
.conf-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--accent));}
.conf-pct{font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:3px;text-align:right;}

/* Export bar */
.export-bar{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--panel);border:1px solid var(--border2);
  border-radius:4px;padding:12px 18px;margin-bottom:24px;
}
.export-lbl{font-family:var(--mono);font-size:10px;color:var(--text2);letter-spacing:2px;text-transform:uppercase;}
.export-btns{display:flex;gap:8px;}
.exp-btn{
  display:flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1px;
  padding:8px 16px;border-radius:3px;border:1px solid;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.exp-btn svg{width:13px;height:13px;flex-shrink:0;}
.exp-html{color:var(--green);border-color:rgba(0,217,122,.35);background:rgba(0,217,122,.07);}
.exp-html:hover{background:rgba(0,217,122,.14);border-color:var(--green);}
.exp-txt {color:var(--accent);border-color:rgba(0,200,240,.35);background:rgba(0,200,240,.07);}
.exp-txt:hover{background:rgba(0,200,240,.14);border-color:var(--accent);}
.exp-btn:disabled{opacity:.35;cursor:not-allowed;}
.exp-pdf {color:#ff6b6b;border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.07);}
.exp-pdf:hover:not(:disabled){background:rgba(255,107,107,.14);border-color:#ff6b6b;}
.exp-docx{color:#a78bfa;border-color:rgba(167,139,250,.35);background:rgba(167,139,250,.07);}
.exp-docx:hover:not(:disabled){background:rgba(167,139,250,.14);border-color:#a78bfa;}

/* Sections */
.section{
  margin-bottom:12px;background:var(--panel);
  border:1px solid var(--border);border-radius:6px;overflow:hidden;
}
.sec-hdr{
  display:flex;align-items:center;gap:13px;
  padding:16px 22px;border-bottom:1px solid var(--border);
  background:var(--bg2);cursor:pointer;user-select:none;
  transition:background .15s;
}
.sec-hdr:hover{background:#0d1525;}
.sec-num{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:2px;width:22px;flex-shrink:0;}
.sec-title{font-family:var(--display);font-size:17px;letter-spacing:2px;color:var(--text);flex:1;}
.sec-chev{font-size:11px;color:var(--text3);transition:transform .25s;flex-shrink:0;}
.section.closed .sec-chev{transform:rotate(-90deg);}
.section.closed .sec-body{display:none;}
.sec-body{padding:22px;}

/* Report content styles (used by AI-generated HTML) */
.rc h3{
  font-family:var(--mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:var(--accent);margin:22px 0 11px;padding-bottom:6px;
  border-bottom:1px solid var(--border);
}
.rc h3:first-child{margin-top:0;}
.rc p{font-size:13.5px;line-height:1.78;color:var(--text2);margin-bottom:11px;}
.rc ul{list-style:none;margin-bottom:13px;}
.rc ul li{
  font-size:13px;color:var(--text2);line-height:1.65;
  padding:5px 0 5px 17px;position:relative;
  border-bottom:1px solid rgba(22,33,58,.6);
}
.rc ul li:last-child{border-bottom:none;}
.rc ul li::before{content:'▸';position:absolute;left:0;top:7px;color:var(--accent);font-size:10px;}
.rc strong{color:var(--text);font-weight:600;}

/* Source tags — verified data with clickable link */
.source-tag{
  display:inline-flex;align-items:center;gap:3px;
  font-family:var(--mono);font-size:9px;color:var(--green);
  border:1px solid rgba(0,217,122,.4);border-radius:2px;
  padding:1px 6px;margin-left:3px;text-decoration:none;
  background:rgba(0,217,122,.06);
  transition:color .15s,border-color .15s,background .15s;vertical-align:middle;
}
.source-tag:hover{color:#fff;border-color:var(--green);background:rgba(0,217,122,.18);}
.source-tag::before{content:'✓ ';font-size:8px;}

/* Estimate tags — hover shows reasoning basis */
.est-tag{
  display:inline-flex;align-items:center;gap:3px;position:relative;
  font-family:var(--mono);font-size:9px;color:var(--yellow);
  border:1px solid rgba(245,196,0,.3);border-radius:2px;
  padding:1px 6px;margin-left:3px;cursor:help;
  background:rgba(245,196,0,.06);vertical-align:middle;
}
.est-tag::before{content:'⚠ ';}

/* Tooltip popup on hover for estimate tags */
.est-tag .est-tip{
  display:none;position:fixed;z-index:9999;
  background:#0f1a2e;border:1px solid var(--border2);border-radius:4px;
  padding:8px 11px;max-width:280px;width:max-content;
  font-family:var(--mono);font-size:10px;line-height:1.55;color:var(--text2);
  box-shadow:0 4px 20px rgba(0,0,0,.6);pointer-events:none;
}

/* Research stats bar */
.research-bar{
  display:flex;align-items:center;gap:14px;
  background:var(--panel);border:1px solid var(--border);
  border-radius:4px;padding:10px 18px;margin-bottom:12px;
  font-family:var(--mono);font-size:10px;color:var(--text3);
}
.research-bar .rb-stat{display:flex;align-items:center;gap:5px;}
.rb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.rb-dot.green{background:var(--green);}
.rb-dot.yellow{background:var(--yellow);}
.rb-dot.red{background:var(--red);}

/* Metric grid */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin:14px 0;}
.metric-card{
  background:var(--bg);border:1px solid var(--border);border-radius:4px;
  padding:15px;position:relative;overflow:hidden;
}
.metric-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.metric-card.blue::after  {background:var(--accent);}
.metric-card.green::after {background:var(--green);}
.metric-card.purple::after{background:var(--purple);}
.metric-card.yellow::after{background:var(--yellow);}
.metric-card.red::after   {background:var(--red);}
.metric-label{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:7px;}
.metric-value{font-family:var(--display);font-size:28px;letter-spacing:1px;color:var(--text);line-height:1;margin-bottom:3px;}
.metric-sub{font-family:var(--mono);font-size:9px;color:var(--text3);}

/* Data table */
.data-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px;margin:10px 0;}
.data-table th{
  text-align:left;padding:9px 11px;background:var(--bg2);
  color:var(--text3);font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:400;
  border-bottom:1px solid var(--border2);
}
.data-table td{
  padding:9px 11px;color:var(--text2);font-size:11px;
  border-bottom:1px solid var(--border);vertical-align:top;
}
.data-table tr:last-child td{border-bottom:none;}
.data-table tbody tr:hover td{background:rgba(0,200,240,.02);}
.td-highlight{color:var(--text);font-weight:500;}
.td-green{color:var(--green);}
.td-red  {color:var(--red);}
.td-accent{color:var(--accent);}
.td-yellow{color:var(--yellow);}

/* Timeline */
.timeline{padding:6px 0;}
.timeline-item{display:grid;grid-template-columns:105px 18px 1fr;gap:0 14px;margin-bottom:2px;}
.timeline-date{font-family:var(--mono);font-size:10px;color:var(--text3);text-align:right;padding-top:13px;}
.timeline-line{display:flex;flex-direction:column;align-items:center;}
.timeline-dot{
  width:8px;height:8px;border-radius:50%;margin-top:14px;flex-shrink:0;
  background:var(--accent);box-shadow:0 0 7px rgba(0,200,240,.5);
}
.timeline-dot.green {background:var(--green); box-shadow:0 0 7px rgba(0,217,122,.5);}
.timeline-dot.purple{background:var(--purple);box-shadow:0 0 7px rgba(108,63,255,.5);}
.timeline-dot.yellow{background:var(--yellow);box-shadow:0 0 7px rgba(245,196,0,.5);}
.timeline-connector{flex:1;width:1px;background:var(--border);margin-top:3px;}
.timeline-content{
  background:var(--bg);border:1px solid var(--border);
  border-radius:3px;padding:12px 14px;margin-bottom:6px;
}
.timeline-event-title{font-size:13px;color:var(--text);font-weight:500;margin-bottom:3px;}
.timeline-event-desc{font-size:12px;color:var(--text2);line-height:1.6;}

/* Callouts */
.callout{
  border-left:3px solid;padding:12px 15px;margin:12px 0;
  background:rgba(255,255,255,.018);border-radius:0 3px 3px 0;
  font-size:13px;line-height:1.65;color:var(--text2);
}
.callout.accent{border-color:var(--accent);}
.callout.green {border-color:var(--green);}
.callout.red   {border-color:var(--red);}
.callout.yellow{border-color:var(--yellow);}

/* Tags & divider */
.tag-row{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0;}
.tag{
  font-family:var(--mono);font-size:10px;letter-spacing:1px;
  padding:4px 9px;border-radius:2px;border:1px solid var(--border2);
  color:var(--text2);background:var(--bg);
}
.tag.accent{color:var(--accent);border-color:rgba(0,200,240,.3);background:rgba(0,200,240,.05);}
.tag.green {color:var(--green); border-color:rgba(0,217,122,.3);background:rgba(0,217,122,.05);}
.divider{height:1px;background:var(--border);margin:18px 0;}

/* Disclaimer */
.disclaimer{
  margin-top:44px;padding:18px 22px;
  border:1px solid var(--border);border-radius:4px;background:var(--panel);
  font-family:var(--mono);font-size:10px;color:var(--text3);line-height:1.75;
}
.disclaimer strong{color:var(--text2);}

/* Scrollbar */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* Responsive */
@media(max-width:720px){
  .inputs-row{grid-template-columns:1fr;}
  .rpt-header{grid-template-columns:1fr;}
  .rpt-company{font-size:38px;}
  .metric-grid{grid-template-columns:repeat(2,1fr);}
  .export-bar{flex-direction:column;align-items:flex-start;gap:10px;}
}
</style>
</head>
<body>
<div class="shell">

  <!-- ── Header ── -->
  <header class="site-header">
    <div class="logo">
      <div class="logo-hex">CI</div>
      <div class="logo-name">CYBER<em>INTEL</em></div>
    </div>
    <div class="hdr-right">
      <div><span class="live-dot"></span>LIVE DATA FEED</div>
      <div>M&amp;A INTELLIGENCE PLATFORM</div>
      <div id="hdrDate"></div>
    </div>
  </header>

  <!-- ── Input panel ── -->
  <div class="input-panel">
    <div class="panel-title">&#9658; Target Configuration</div>

    <div class="inputs-row">
      <div class="field">
        <label class="field-lbl" for="companyInp">Company Website URL</label>
        <input class="field-inp" id="companyInp" type="url"
          placeholder="e.g. https://crowdstrike.com">
      </div>
      <div class="field">
        <label class="field-lbl" for="sectorInp">Sector Focus <span style="color:var(--text3)">(optional)</span></label>
        <input class="field-inp" id="sectorInp" type="text"
          placeholder="e.g. Endpoint Security, Cloud Security, IAM...">
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button class="gen-btn" id="genBtnCo" style="background:linear-gradient(135deg,#0055dd,#00c8f0);">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          Company Report
        </button>
        <button class="gen-btn" id="genBtnSec" style="background:linear-gradient(135deg,#6a00dd,#0055dd);letter-spacing:1.5px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          Sector Report
        </button>
      </div>
    </div>
    <div style="margin-top:14px;display:flex;align-items:center;gap:12px;">
      <button class="gen-btn" id="testApisBtn" style="background:linear-gradient(135deg,#333,#555);height:32px;padding:0 16px;font-size:9px;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        Test API Keys
      </button>
      <span id="healthResult" style="font-family:var(--mono);font-size:10px;color:var(--text3);"></span>
    </div>
  </div>

  <!-- ── Error banner ── -->
  <div class="err-banner" id="errBanner">
    <span class="err-icon">&#9888;</span>
    <span class="err-msg" id="errMsg"></span>
  </div>

  <!-- ── Progress panel ── -->

    <div class="prog-steps" id="progSteps"></div>
  </div>

  <!-- ── Report ── -->

</div><!-- /shell -->

<script>
(function () {
'use strict';

/* ── Constants ───────────────────────────────────── */
var STEPS = [
  'Scraping web — company profile, leadership, investors...',
  'Scraping web — funding rounds, valuations, deal terms...',
  'Scraping web — M&A activity, partnerships, acquisitions...',
  'Scraping web — revenue, ARR, growth metrics...',
  'Scraping web — news, product launches, events...',
  'Pulling real-time public peer financials (FMP)...',
  'Compiling all research data...',
  'Generating grounded intelligence report via Claude...'
];

var CO_TITLES = [
  'About the Company',
  "Company Transactions & Deal Analysis",
  'Executive Summary — Company Snapshot',
  'News & Events — Company Specific',
  'Public Markets & Peer Benchmarking'
];
var SEC_TITLES = [
  'Sector Overview & 2026 Activity Dashboard',
  'Industry Insights & Market Trends (H1 2026)',
  'Conferences & Events',
  'M&A Activity — Broader Market'
];

/* ── State ───────────────────────────────────────── */
var _timer      = null;
var _controller = null;
var _sections   = [];
var _co         = '';
var _coUrl      = '';
var _sector     = '';
var _date       = '';

/* ── Init ────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', function () {
  var hd = document.getElementById('hdrDate');
  if (hd) hd.textContent = new Date().toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }).toUpperCase();

  var bCo  = document.getElementById('genBtnCo');
  var bSec = document.getElementById('genBtnSec');
  if (bCo)  bCo.addEventListener('click',  function () { onGenerate('company'); });
  if (bSec) bSec.addEventListener('click', function () { onGenerate('sector');  });

  /* Test API Keys button */
  var testBtn = document.getElementById('testApisBtn');
  if (testBtn) testBtn.addEventListener('click', function () {
    var out = document.getElementById('healthResult');
    testBtn.disabled = true;
    out.textContent = 'Testing...';
    out.style.color = 'var(--accent)';
    fetch('/api/health')
      .then(function (r) { return r.json(); })
      .then(function (h) {
        var parts = [];
        var tavSym = h.tavily.status === 'ok' ? '✓' : h.tavily.configured ? '✗' : '—';
        var fmpSym = h.fmp.status === 'ok' ? '✓' : h.fmp.configured ? '✗' : '—';
        var antSym = h.anthropic.configured ? '✓' : '✗';
        parts.push('Tavily: ' + tavSym + (h.tavily.detail ? ' (' + h.tavily.detail + ')' : h.tavily.configured ? '' : ' not configured'));
        parts.push('FMP: ' + fmpSym + (h.fmp.detail ? ' (' + h.fmp.detail + ')' : h.fmp.configured ? '' : ' not configured'));
        parts.push('Anthropic: ' + antSym);
        out.innerHTML = parts.join(' &nbsp;|&nbsp; ');
        var allOk = h.tavily.status === 'ok' && h.fmp.status === 'ok' && h.anthropic.configured;
        out.style.color = allOk ? 'var(--green)' : 'var(--yellow)';
        testBtn.disabled = false;
      })
      .catch(function (e) {
        out.textContent = 'Failed to reach server: ' + e.message;
        out.style.color = 'var(--red)';
        testBtn.disabled = false;
      });
  });

  /* Tooltip positioning for est-tag (uses fixed positioning to avoid overflow clipping) */
  document.addEventListener('mouseover', function (e) {
    var tag = e.target.closest('.est-tag');
    if (!tag) return;
    var tip = tag.querySelector('.est-tip');
    if (!tip) return;
    var r = tag.getBoundingClientRect();
    tip.style.display = 'block';
    tip.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 290)) + 'px';
    tip.style.top  = (r.bottom + 6) + 'px';
  });
  document.addEventListener('mouseout', function (e) {
    var tag = e.target.closest('.est-tag');
    if (!tag) return;
    var tip = tag.querySelector('.est-tip');
    if (tip) tip.style.display = 'none';
  });

  ['companyInp','sectorInp'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var b = document.getElementById('genBtnCo');
        if (b && !b.disabled) onGenerate('company');
      }
    });
  });
});

/* ── UI helpers ──────────────────────────────────── */
function $id(id) { return document.getElementById(id); }

function setFill(pct) { $id('progFill').style.width = pct + '%'; }

function setStep(i, state) {
  var el = $id('step' + i);
  if (!el) return;
  el.classList.remove('running', 'done');
  if (state) el.classList.add(state);
  el.querySelector('.step-ic').textContent =
    state === 'done' ? '✓' : state === 'running' ? '◈' : '○';
}

function showErr(msg) {
  $id('errMsg').textContent = msg;
  $id('errBanner').classList.add('show');
}

function hideErr() { $id('errBanner').classList.remove('show'); }

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ── Generate ────────────────────────────────────── */
var _mode          = 'company'; // 'company' | 'sector'
var _urlContext    = { url:'', domain:'', name:'', tld:'', pathHint:'' };
var _researchStats = {};

function onGenerate(mode) {
  _mode = mode;
  var rawUrl  = $id('companyInp').value.trim();
  var sector  = $id('sectorInp').value.trim();

  if (!rawUrl)  { showErr('Enter the company website URL (e.g. https://crowdstrike.com).'); $id('companyInp').focus(); return; }

  /* Normalise URL — add https:// if missing */
  var companyUrl = rawUrl;
  if (!/^https?:\/\//i.test(companyUrl)) companyUrl = 'https://' + companyUrl;

  /* Validate it looks like a URL */
  try { new URL(companyUrl); } catch(e) {
    showErr('Please enter a valid website URL, e.g. https://crowdstrike.com');
    $id('companyInp').focus(); return;
  }

  /* Parse URL into rich context without asking the model to browse it */
  var parsedUrl  = new URL(companyUrl);
  var hostname   = parsedUrl.hostname.replace(/^www\./, '');
  var parts      = hostname.split('.');
  var domainCore = parts[0]; /* e.g. 'crowdstrike' from 'crowdstrike.com' */
  var tld        = parts.slice(1).join('.'); /* e.g. 'com', 'co.uk', 'ch' */
  var pathHint   = parsedUrl.pathname.replace(/^\//, '').split('/')[0] || ''; /* first path segment */
  /* Build display name: capitalise, handle hyphens e.g. 'sentinel-one' → 'Sentinel-One' */
  var company = domainCore
    .split('-')
    .map(function(w){ return w.charAt(0).toUpperCase() + w.slice(1); })
    .join('');
  /* Build context object passed to prompts */
  _urlContext = {
    url:       companyUrl,
    domain:    hostname,
    name:      company,
    tld:       tld,
    pathHint:  pathHint
  };

  hideErr();

  _co     = company;
  _coUrl  = companyUrl;
  _sector = sector;
  _date   = new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });

  var btnCo  = $id('genBtnCo');
  var btnSec = $id('genBtnSec');
  btnCo.disabled = btnSec.disabled = true;
  $id('reportWrap').classList.remove('show');
  $id('reportWrap').innerHTML = '';

  var pp = $id('progPanel');
  pp.classList.add('show');
  $id('progSteps').innerHTML = STEPS.map(function (s, i) {
    return '<div class="prog-step" id="step' + i + '"><span class="step-ic">○</span><span>' + s + '</span></div>';
  }).join('');
  setFill(0);

  /* Step 0: start progress */
  setStep(0, 'running');
  setFill(5);

  if (_controller) _controller.abort();
  _controller = new AbortController();
  var timeoutId = setTimeout(function () { _controller.abort(); }, 900000);

  var sNote = sector ? ' within the ' + sector + ' sector' : ' in the cybersecurity sector';

  /* Step 1: Call /api/research — real Tavily web searches */
  fetch('/api/research', {
    signal: _controller.signal,
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      company: company,
      domain: _urlContext.domain,
      sector: sector || 'cybersecurity',
      mode: mode
    })
  })
  .then(function (res) {
    if (!res.ok) throw new Error('Research API returned HTTP ' + res.status);
    return res.json();
  })
  .then(function (research) {
    /* Mark search steps done */
    for (var i = 0; i < 6; i++) setStep(i, 'done');
    setStep(6, 'running');
    setFill(70);

    /* Store research stats for display in report header */
    _researchStats = research.stats || {};
    var webContext = research.context || '';

    console.log('[CyberIntel] Research stats:', _researchStats);
    console.log('[CyberIntel] Research context length:', webContext.length, 'chars');

    var prompt = mode === 'company'
      ? buildCompanyPrompt(company, sNote, _date, webContext)
      : buildSectorPrompt(company, sNote, _date, webContext);

    setStep(6, 'done');
    setStep(7, 'running');
    setFill(80);

    /* Step 2: Call Claude with enriched prompt */
    return fetch('/api/messages', {
      signal: _controller.signal,
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5-20250929',
        max_tokens: 16000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
  })
  .then(function (res) {
    clearTimeout(timeoutId);
    if (!res.ok) {
      return res.text().then(function (txt) {
        try { var b = JSON.parse(txt); throw new Error((b.error && (b.error.message || b.error)) || 'HTTP ' + res.status); }
        catch(e) { if (e.message.indexOf('HTTP') === 0 || e.message.indexOf('Error') >= 0) throw e; throw new Error('HTTP ' + res.status + ': ' + txt.slice(0, 200)); }
      });
    }
    return res.json();
  })
  .then(function (data) {
    STEPS.forEach(function (_, i) { setStep(i, 'done'); });
    setFill(100);
    var rawHtml = (data.content || []).filter(function (b) { return b.type === 'text'; }).map(function (b) { return b.text; }).join('\n');
    render(company, sector, rawHtml, _date, mode);
  })
  .catch(function (err) {
    clearTimeout(timeoutId);
    pp.classList.remove('show');
    btnCo.disabled = btnSec.disabled = false;
    var m = err.message || String(err);
    if (/abort/i.test(m))             showErr('Request timed out. Make sure server.js is running.');
    else if (/401|403|invalid/i.test(m)) showErr('Invalid API key — check Railway environment variables.');
    else if (/429|rate_limit|credit/i.test(m)) showErr('Credit balance too low or rate limit hit. Top up at console.anthropic.com/settings/billing');
    else if (/Failed to fetch|network/i.test(m)) showErr('Cannot reach server. Make sure it is running.');
    else showErr('Error: ' + m);
  });
}

/* ── Render ──────────────────────────────────────── */
function render(co, sector, rawHtml, today, mode) {
  $id('progPanel').classList.remove('show');

  var isCompany = mode === 'company';
  var TITLES    = isCompany ? CO_TITLES : SEC_TITLES;
  var nSections = TITLES.length;
  var reportTag = isCompany ? 'Company Intelligence Report' : 'Sector Intelligence Report';
  var conf      = Math.floor(74 + Math.random() * 18);
  var sb        = sector ? sector.toUpperCase() : 'CYBERSECURITY';

  _sections = splitSections(rawHtml, nSections);

  var h = '';

  /* header */
  h += '<div class="rpt-header">';
  h +=   '<div>';
  h +=     '<div class="rpt-company">' + esc(co.toUpperCase()) + '</div>';
  h +=     '<div class="rpt-badges">';

/* ── Section splitter ────────────────────────────── */
function splitSections(html, n) {
  n = n || 8;
  var parts = html.split(/\[SECTION:\d+\]/i);
  if (parts.length > 1) { var s = parts.slice(1, n + 1); while (s.length < n) s.push(''); return s; }
  var hrs = html.split(/<hr\s*\/?>/i);
  if (hrs.length >= n) return bucket(hrs, n);
  var h3s = html.split(/(?=<h3[\s>])/i);
  if (h3s.length > 1) return bucket(h3s, n);
  var chunk = Math.ceil(html.length / n);
  return Array.from({ length: n }, function (_, i) { return html.slice(i * chunk, (i + 1) * chunk); });
}
function bucket(parts, n) {
  var pb = Math.ceil(parts.length / n), bk = [];
  for (var i = 0; i < n; i++) bk.push('');
  parts.forEach(function (p, i) { bk[Math.min(Math.floor(i / pb), n - 1)] += p; });
  return bk;
}

function doExportDocx(co, sector, today, TITLES, suffix) {

function _buildDocx(co, sector, today, TITLES, suffix, btn) {
  btn.disabled = true;
  btn.textContent = 'Building DOCX...';

  var D = window.docx;
  var PW = 12240, PH = 15840, MAR = 1080, CW = PW - MAR * 2;
  var BLUE = '1A5DAF', TEAL = '0099BB', GREY = '8A9AB8', LGREY = 'D8DFF0';
  var bdr = { style: D.BorderStyle.SINGLE, size: 1, color: LGREY };
  var borders = { top: bdr, bottom: bdr, left: bdr, right: bdr };

  function t(text, opts) {
    opts = opts || {};
    return new D.TextRun({ text: String(text || ''), font: 'Arial', size: opts.size || 20,
      bold: opts.bold || false, italics: opts.italic || false, color: opts.color || '333333' });
  }
  function p(runs, opts) {
    opts = opts || {};
    if (!Array.isArray(runs)) runs = [runs];
    return new D.Paragraph({
      children: runs,
      alignment: opts.align || D.AlignmentType.LEFT,
      spacing: { before: opts.before || 0, after: opts.after !== undefined ? opts.after : 100 },
      indent: opts.indent ? { left: opts.indent } : undefined,
      numbering: opts.bullet ? { reference: 'bullets', level: 0 } : undefined,
      border: opts.borderBottom ? { bottom: { style: D.BorderStyle.SINGLE, size: opts.borderBottom, color: opts.borderColor || LGREY, space: 1 } } : undefined
    });
  }
  function stripHtml(html) {
    var d = document.createElement('div'); d.innerHTML = html || '';
    return (d.textContent || d.innerText || '').replace(/\s+/g, ' ').trim();
  }
  function cellMake(text, w, isHdr) {
    return new D.TableCell({
      borders: borders,
      width: { size: w, type: D.WidthType.DXA },
      shading: { fill: isHdr ? 'E4EBF8' : 'FFFFFF', type: D.ShadingType.CLEAR },
      margins: { top: 60, bottom: 60, left: 100, right: 100 },
      children: [p([t(text, { bold: isHdr, size: isHdr ? 17 : 18, color: isHdr ? BLUE : '444444' })], { after: 0 })]
    });
  }
  function htmlTableToDocx(el) {
    try {
      var rows = Array.from(el.querySelectorAll('tr'));
      if (!rows.length) return null;
      var maxCols = 0;
      rows.forEach(function(r) { maxCols = Math.max(maxCols, r.querySelectorAll('th,td').length); });
      if (!maxCols) return null;
      var colW = Math.floor(CW / maxCols);
      var colWidths = Array.from({ length: maxCols }, function() { return colW; });
      colWidths[maxCols - 1] += (CW - colW * maxCols);
      var dRows = rows.map(function(tr) {
        var isHdr = !!tr.querySelector('th');
        var cells = Array.from(tr.querySelectorAll('th,td'));
        var dCells = [];
        for (var ci = 0; ci < maxCols; ci++) {
          dCells.push(cellMake(cells[ci] ? stripHtml(cells[ci].innerHTML) : '', colWidths[ci], isHdr));
        }
        return new D.TableRow({ children: dCells, tableHeader: isHdr });
      });
      return new D.Table({ width: { size: CW, type: D.WidthType.DXA }, columnWidths: colWidths, rows: dRows });
    } catch(e) { return null; }
  }
  function nodeToDocx(node) {
    var out = [];
    Array.from(node.childNodes).forEach(function(n) {
      if (n.nodeType === 3) { var tx = n.textContent.trim(); if (tx) out.push(p([t(tx)])); return; }
      if (n.nodeType !== 1) return;
      var tag = n.tagName.toLowerCase(), cls = n.className || '';
      if (tag === 'h3') {
        out.push(p([t(stripHtml(n.innerHTML).toUpperCase(), { bold: true, size: 19, color: BLUE })], { before: 220, after: 80, borderBottom: 4, borderColor: LGREY }));
      } else if (tag === 'p') {
        var runs = [t(stripHtml(n.innerHTML))];
        if (runs[0].text) out.push(p(runs, { after: 80 }));
      } else if (tag === 'li') {
        out.push(p([t(stripHtml(n.innerHTML))], { bullet: true, after: 50 }));
      } else if (tag === 'table') {
        var tbl = htmlTableToDocx(n);
        if (tbl) { out.push(tbl); out.push(p([], { after: 120 })); }
      } else if (cls.indexOf('metric-card') > -1) {
        var lbl = n.querySelector('.metric-label'), val = n.querySelector('.metric-value'), sub = n.querySelector('.metric-sub');
        out.push(p([
          t((lbl ? lbl.textContent.trim() + ': ' : ''), { size: 16, color: GREY }),
          t(val ? val.textContent.trim() : '—', { bold: true, size: 24, color: BLUE }),
          t(sub ? ' (' + sub.textContent.trim() + ')' : '', { size: 15, color: GREY })
        ], { after: 60 }));
      } else if (cls.indexOf('callout') > -1) {
        out.push(p([t('| ' + stripHtml(n.innerHTML), { italic: true, color: '445577' })], { before: 80, after: 80, indent: 300 }));
      } else {
        nodeToDocx(n).forEach(function(x) { out.push(x); });
      }
    });
    return out;
  }

  /* Build document content */
  var children = [];

  /* Cover */
  children.push(p([t('M&A INTELLIGENCE REPORT', { bold: true, size: 32, color: BLUE })], { align: D.AlignmentType.CENTER, after: 120 }));
  children.push(p([t(co.toUpperCase(), { bold: true, size: 64, color: '0D1B3E' })], { align: D.AlignmentType.CENTER, after: 100 }));
  if (sector) children.push(p([t(sector.toUpperCase(), { size: 22, color: TEAL })], { align: D.AlignmentType.CENTER, after: 80 }));
  children.push(p([t('Generated: ' + today + '   |   Analyst Engine: Claude Sonnet 4', { size: 17, color: GREY })], { align: D.AlignmentType.CENTER, after: 40 }));
  children.push(p([t(suffix === '_Company' ? 'COMPANY INTELLIGENCE REPORT' : 'SECTOR INTELLIGENCE REPORT', { size: 17, color: GREY })], { align: D.AlignmentType.CENTER, after: 400 }));
  children.push(p([], { before: 0, after: 0, borderBottom: 10, borderColor: BLUE }));

  /* Sections */
  TITLES.forEach(function(title, idx) {
    children.push(new D.Paragraph({ children: [new D.PageBreak()] }));
    children.push(p([
      t('0' + (idx + 1) + '  ', { size: 18, color: GREY, bold: true }),
      t(title.toUpperCase(), { bold: true, size: 28, color: BLUE })
    ], { before: 0, after: 160, borderBottom: 8, borderColor: BLUE }));
    var el = document.getElementById('rc' + (idx + 1));
    if (el) {
      nodeToDocx(el).forEach(function(x) { children.push(x); });
    } else {
      children.push(p([t('Data not available.', { italic: true, color: GREY })]));
    }
  });

  /* Disclaimer */
  children.push(new D.Paragraph({ children: [new D.PageBreak()] }));
  children.push(p([t('DISCLAIMER', { bold: true, size: 20, color: BLUE })], { after: 100 }));
  children.push(p([t('Generated by CyberIntel M&A Intelligence Platform using Claude Sonnet 4 as of ' + today + '. For informational purposes only. Not financial, legal, or investment advice. Estimates marked Est. are model-generated approximations — verify before use.', { size: 17, color: '666666' })]));

  var doc = new D.Document({
    numbering: { config: [{ reference: 'bullets', levels: [{ level: 0, format: D.LevelFormat.BULLET, text: '\u2022', alignment: D.AlignmentType.LEFT, style: { paragraph: { indent: { left: 480, hanging: 240 } } } }] }] },
    styles: { default: { document: { run: { font: 'Arial', size: 20 } } } },
    sections: [{
      properties: { page: { size: { width: PW, height: PH }, margin: { top: MAR, right: MAR, bottom: MAR, left: MAR } } },
      headers: { default: new D.Header({ children: [p([
        t('CyberIntel M&A Intelligence  |  ' + co.toUpperCase(), { size: 15, color: GREY }),
        t('\t' + today, { size: 15, color: GREY })
      ], { after: 0, borderBottom: 2, borderColor: LGREY })] }) },
      footers: { default: new D.Footer({ children: [p([
        t('CONFIDENTIAL — For informational purposes only', { size: 15, color: GREY }),
        t('\tPage ', { size: 15, color: GREY }),
        new D.TextRun({ children: [D.PageNumber.CURRENT], size: 15, font: 'Arial', color: GREY })
      ], { before: 0, after: 0 })] }) },
      children: children
    }]
  });

  D.Packer.toBlob(doc).then(function(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = slug(co) + '_MA_Intelligence' + suffix + '_' + new Date().getFullYear() + '.docx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13l2 4 2-4 2 4 2-4"/></svg> Download DOCX';
  }).catch(function(err) {
    btn.disabled = false; btn.textContent = 'Download DOCX';
    alert('DOCX export failed: ' + err.message);
  });
} /* end _buildDocx */

/* ── TXT Export ──────────────────────────────────── */
function doExportTxt(co, sector, today, TITLES, suffix) {
  var HR = '='.repeat(70), hr = '-'.repeat(70);
  var lines = [HR, '  M&A INTELLIGENCE REPORT — ' + (suffix === '_Company' ? 'COMPANY' : 'SECTOR'),
               '  ' + co.toUpperCase() + (sector ? ' | ' + sector.toUpperCase() : ''),
               '  Generated: ' + today + ' | Analyst Engine: Claude Sonnet 4', HR];
  for (var i = 0; i < TITLES.length; i++) {
    lines.push('', hr, '  SECTION ' + (i + 1) + ': ' + TITLES[i].toUpperCase(), hr);
    var el = $id('rc' + (i + 1));
    lines.push(el ? nodeToText(el) : '  Data not available.');
  }
  lines.push('', HR, '  DISCLAIMER', HR,
    '  Generated by CyberIntel M&A Intelligence Platform using Claude Sonnet 4.',
    '  For informational purposes only. Estimates marked Est. are model-generated approximations.',
    '  Verify all metrics with primary sources before making strategic decisions.');
  download(lines.join('\n'), slug(co) + '_MA_Intelligence' + suffix + '_' + new Date().getFullYear() + '.txt', 'text/plain');
}

function nodeToText(node) {
  var out = [];
  Array.from(node.childNodes).forEach(function (n) {
    if (n.nodeType === 3) { var t = n.textContent.trim(); if (t) out.push('  ' + t); return; }
    if (n.nodeType !== 1) return;
    var tag = n.tagName.toLowerCase(), cls = n.className || '';
    if (tag === 'h3')    { out.push('', '  > ' + n.textContent.trim().toUpperCase(), ''); }
    else if (tag === 'p')  { var t = n.textContent.trim(); if (t) out.push('  ' + t); }
    else if (tag === 'li') { out.push('    • ' + n.textContent.trim()); }
    else if (tag === 'table') {
      out.push('');
      Array.from(n.querySelectorAll('tr')).forEach(function (r) {
        var cells = Array.from(r.querySelectorAll('th,td')).map(function (c) { return c.textContent.trim().substring(0, 20).padEnd(20); });
        out.push('  ' + cells.join(' | '));
      });
      out.push('');
    }
    else if (cls.indexOf('metric-card') > -1) {
      var l = n.querySelector('.metric-label'), v = n.querySelector('.metric-value'), s = n.querySelector('.metric-sub');
      out.push('  [' + (l ? l.textContent.trim() : '') + '] ' + (v ? v.textContent.trim() : '') + (s ? ' (' + s.textContent.trim() + ')' : ''));
    }
    else { out.push(nodeToText(n)); }
  });
  return out.join('\n');
}

/* ── Utilities ───────────────────────────────────── */
function download(content, filename, mime) {
  var blob = new Blob([content], { type: mime + ';charset=utf-8' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
}
function slug(s) { return s.replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_|_$/g, ''); }

}());
